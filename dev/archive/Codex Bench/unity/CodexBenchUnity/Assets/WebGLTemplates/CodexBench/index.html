<!doctype html>
<html lang="en-us"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body,#unity-canvas{width:100%;height:100%;margin:0;overflow:hidden;background:#292b30}#unity-canvas{display:block}</style></head>
<body><canvas id="unity-canvas" tabindex="-1"></canvas><script>
const canvas=document.querySelector('#unity-canvas');
const buildUrl='Build';
const config={
  dataUrl:buildUrl+'/{{{ DATA_FILENAME }}}',frameworkUrl:buildUrl+'/{{{ FRAMEWORK_FILENAME }}}',
  codeUrl:buildUrl+'/{{{ CODE_FILENAME }}}',streamingAssetsUrl:'StreamingAssets',
  companyName:'{{{ COMPANY_NAME }}}',productName:'{{{ PRODUCT_NAME }}}',productVersion:'{{{ PRODUCT_VERSION }}}'
};
const post=value=>{const handler=window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.codexBenchUnity;if(handler)handler.postMessage(value);};
const loader=document.createElement('script');loader.src=buildUrl+'/{{{ LOADER_FILENAME }}}';
loader.onload=()=>createUnityInstance(canvas,config).then(instance=>{
  window.unityInstance=instance;
  window.codexBenchUnity={ready:true,
    loadMesh(payload){const started=performance.now();instance.SendMessage('CodexBenchBridge','LoadMesh',JSON.stringify(payload));post({type:'loaded',milliseconds:performance.now()-started,triangles:payload.triangles});},
    clearMesh(){instance.SendMessage('CodexBenchBridge','ClearMesh','');},
    setTheme(theme){instance.SendMessage('CodexBenchBridge','SetTheme',JSON.stringify(theme));},
    fit(){instance.SendMessage('CodexBenchBridge','Fit','');}
  };
  post({type:'ready'});
  let frames=0,last=performance.now();function report(now){frames++;if(now-last>=1000){post({type:'frames',count:frames});frames=0;last=now;}requestAnimationFrame(report);}requestAnimationFrame(report);
}).catch(error=>post({type:'error',message:String(error)}));
document.body.appendChild(loader);
</script></body></html>
