<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body, canvas { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #060914; }
    canvas { display: block; outline: none; }
    #notice { position: fixed; inset: 0; display: grid; place-items: center;
      color: #7d8799; font: 13px -apple-system, BlinkMacSystemFont, sans-serif;
      pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="viewport" tabindex="0"></canvas>
  <div id="notice">Starting raw WebGPU…</div>
  <script type="module">
    const canvas = document.querySelector('#viewport');
    const notice = document.querySelector('#notice');
    const send = value => window.webkit?.messageHandlers?.codexBenchRawWebGPU?.postMessage(value);

    let device;
    let context;
    let surfacePipeline;
    let edgePipeline;
    let uniformBuffer;
    let bindGroup;
    let positionBuffer;
    let normalBuffer;
    let colorBuffer;
    let indexBuffer;
    let edgeBuffer;
    let indexCount = 0;
    let edgeVertexCount = 0;
    let depthTexture;
    let depthView;
    let multisampleTexture;
    let multisampleView;
    let textureWidth = 0;
    let textureHeight = 0;
    let selected = false;
    let yaw = 0.65;
    let pitch = 0.42;
    let roll = 0;
    let distance = 4;
    let target = [0, 0, 0];
    let lastPositions;
    const uniformValues = new Float32Array(64);
    let theme = {
      background: [0.16, 0.17, 0.19], edge: [0.16, 0.18, 0.22],
      selection: [1, 0.48, 0], roughness: 0.5, metallic: 0,
      edgeStrength: 0.7, overrideColor: null,
      key: { color: [1,1,1], direction: [0.5,0.9,0.6], intensity: 0.75 },
      fill: { color: [0.75,0.82,1], direction: [-0.7,0.3,0.4], intensity: 0.3 },
      rim: { color: [1,1,1], direction: [0.1,0.5,-0.8], intensity: 0.225 }
    };

    const shaderSource = /* wgsl */`
      struct Uniforms {
        viewProjection: mat4x4f,
        cameraPosition: vec4f,
        keyDirection: vec4f,
        keyColor: vec4f,
        fillDirection: vec4f,
        fillColor: vec4f,
        rimColor: vec4f,
        material: vec4f,
        overrideColor: vec4f,
        selectionColor: vec4f,
        edgeColor: vec4f,
      };
      @group(0) @binding(0) var<uniform> uniforms: Uniforms;

      struct SurfaceInput {
        @location(0) position: vec3f,
        @location(1) normal: vec3f,
        @location(2) color: vec4f,
      };
      struct SurfaceOutput {
        @builtin(position) position: vec4f,
        @location(0) world: vec3f,
        @location(1) normal: vec3f,
        @location(2) color: vec4f,
      };

      fn projectedPosition(position: vec3f) -> vec4f {
        return uniforms.viewProjection * vec4f(position, 1.0);
      }

      @vertex fn surfaceVertex(input: SurfaceInput) -> SurfaceOutput {
        var output: SurfaceOutput;
        output.position = projectedPosition(input.position);
        output.world = input.position;
        output.normal = input.normal;
        output.color = input.color;
        return output;
      }

      @fragment fn surfaceFragment(input: SurfaceOutput) -> @location(0) vec4f {
        let n = normalize(input.normal);
        let view = normalize(uniforms.cameraPosition.xyz - input.world);
        let keyDirection = normalize(uniforms.keyDirection.xyz);
        let fillDirection = normalize(uniforms.fillDirection.xyz);
        let key = max(dot(n, keyDirection), 0.0) * uniforms.keyDirection.w;
        let fill = max(dot(n, fillDirection), 0.0) * uniforms.fillDirection.w;
        let rim = pow(1.0 - max(dot(n, view), 0.0), 3.0) * uniforms.rimColor.w;
        let hemisphere = mix(0.18, 0.34, n.y * 0.5 + 0.5);
        let halfVector = normalize(keyDirection + view);
        let exponent = mix(96.0, 8.0, clamp(uniforms.material.x, 0.0, 1.0));
        let highlight = pow(max(dot(n, halfVector), 0.0), exponent)
          * (0.12 + (1.0 - uniforms.material.x) * 0.42);
        let sourceColor = select(input.color, uniforms.overrideColor, uniforms.material.z > 0.5);
        let specular = mix(vec3f(1), sourceColor.rgb, clamp(uniforms.material.y, 0.0, 1.0))
          * highlight;
        let base = select(
          sourceColor.rgb,
          mix(sourceColor.rgb, uniforms.selectionColor.rgb, 0.38),
          uniforms.material.w > 0.5);
        let lighting = vec3f(hemisphere) + uniforms.keyColor.rgb * key
          + uniforms.fillColor.rgb * fill * 0.62;
        return vec4f(base * lighting + specular + uniforms.rimColor.rgb * rim * 0.22,
          sourceColor.a);
      }

      struct EdgeInput { @location(0) position: vec3f };
      @vertex fn edgeVertex(input: EdgeInput) -> @builtin(position) vec4f {
        return projectedPosition(input.position);
      }
      @fragment fn edgeFragment() -> @location(0) vec4f {
        return vec4f(uniforms.edgeColor.rgb, 1.0);
      }
    `;

    const subtract = (a, b) => a.map((value, index) => value - b[index]);
    const add = (a, b) => a.map((value, index) => value + b[index]);
    const scale = (a, value) => a.map(component => component * value);
    const cross = (a, b) => [
      a[1] * b[2] - a[2] * b[1],
      a[2] * b[0] - a[0] * b[2],
      a[0] * b[1] - a[1] * b[0]
    ];
    const normalize = value => {
      const length = Math.hypot(...value) || 1;
      return scale(value, 1 / length);
    };
    const dot = (a, b) => a.reduce((sum, value, index) => sum + value * b[index], 0);
    const camera = () => {
      const cp = Math.cos(pitch);
      const position = add(target, [
        distance * cp * Math.sin(yaw),
        distance * Math.sin(pitch),
        distance * cp * Math.cos(yaw)
      ]);
      const forward = normalize(subtract(target, position));
      const right = normalize(cross(forward, [0, 1, 0]));
      const baseUp = normalize(cross(right, forward));
      const up = add(scale(baseUp, Math.cos(roll)), scale(right, Math.sin(roll)));
      return { position, right, up };
    };

    function decodeBinary(payload) {
      const source = atob(payload.data);
      const bytes = new Uint8Array(source.length);
      for (let index = 0; index < source.length; index += 1) bytes[index] = source.charCodeAt(index);
      let offset = 0;
      const positions = new Float32Array(bytes.buffer, offset, payload.vertexCount * 3);
      offset += payload.vertexCount * 12;
      const normals = new Float32Array(bytes.buffer, offset, payload.vertexCount * 3);
      offset += payload.vertexCount * 12;
      const colors = new Uint8Array(bytes.buffer, offset, payload.vertexCount * 4);
      offset += payload.vertexCount * 4;
      const indices = new Uint32Array(bytes.buffer, offset, payload.indexCount);
      offset += payload.indexCount * 4;
      const edges = new Float32Array(bytes.buffer, offset, payload.edgeVertexCount * 3);
      return { positions, normals, colors, indices, edges };
    }

    function gpuBuffer(data, usage) {
      const buffer = device.createBuffer({
        size: Math.max(4, Math.ceil(data.byteLength / 4) * 4),
        usage: usage | GPUBufferUsage.COPY_DST
      });
      if (data.byteLength) device.queue.writeBuffer(buffer, 0, data.buffer, data.byteOffset, data.byteLength);
      return buffer;
    }

    function destroyGeometry() {
      for (const buffer of [positionBuffer, normalBuffer, colorBuffer, indexBuffer, edgeBuffer]) {
        buffer?.destroy();
      }
      positionBuffer = normalBuffer = colorBuffer = indexBuffer = edgeBuffer = undefined;
      indexCount = edgeVertexCount = 0;
    }

    function fitPositions(positions) {
      if (!positions.length) return;
      const minimum = [positions[0], positions[1], positions[2]];
      const maximum = [...minimum];
      for (let index = 3; index < positions.length; index += 3) {
        for (let axis = 0; axis < 3; axis += 1) {
          minimum[axis] = Math.min(minimum[axis], positions[index + axis]);
          maximum[axis] = Math.max(maximum[axis], positions[index + axis]);
        }
      }
      target = minimum.map((value, axis) => (value + maximum[axis]) * 0.5);
      distance = Math.max(Math.hypot(...subtract(maximum, minimum)) * 1.6, 0.05);
    }

    function updateThemeBackground() {
      const css = `rgb(${theme.background.map(value => value * 255).join(',')})`;
      document.body.style.background = css;
      canvas.style.background = css;
    }

    function writeUniforms(width, height) {
      const currentCamera = camera();
      const forward = normalize(subtract(target, currentCamera.position));
      const right = normalize(cross(forward, currentCamera.up));
      const up = normalize(cross(right, forward));
      const nearPlane = 0.0001;
      const farPlane = 100000;
      const tangentHalfFov = Math.tan(Math.PI / 8);
      const xScale = 1 / (tangentHalfFov * width / height);
      const yScale = 1 / tangentHalfFov;
      const depthScale = farPlane / (farPlane - nearPlane);
      const depthOffset = farPlane * nearPlane / (farPlane - nearPlane);
      const row0 = [...scale(right, xScale), -dot(currentCamera.position, right) * xScale];
      const row1 = [...scale(up, yScale), -dot(currentCamera.position, up) * yScale];
      const row2 = [...scale(forward, depthScale),
        -dot(currentCamera.position, forward) * depthScale - depthOffset];
      const row3 = [...forward, -dot(currentCamera.position, forward)];
      uniformValues.set([
        row0[0], row1[0], row2[0], row3[0],
        row0[1], row1[1], row2[1], row3[1],
        row0[2], row1[2], row2[2], row3[2],
        row0[3], row1[3], row2[3], row3[3]
      ], 0);
      const put = (offset, source, fourth = 0) => {
        uniformValues.set(source.slice(0, 3), offset);
        uniformValues[offset + 3] = source.length > 3 ? source[3] : fourth;
      };
      put(16, currentCamera.position, 1);
      put(20, theme.key.direction, theme.key.intensity);
      put(24, theme.key.color, 1);
      put(28, theme.fill.direction, theme.fill.intensity);
      put(32, theme.fill.color, 1);
      put(36, theme.rim.color, theme.rim.intensity);
      uniformValues.set([
        theme.roughness, theme.metallic, theme.overrideColor ? 1 : 0, selected ? 1 : 0
      ], 40);
      uniformValues.set(theme.overrideColor || [0, 0, 0, 0], 44);
      put(48, theme.selection, 1);
      put(52, theme.edge, theme.edgeStrength || 0);
      device.queue.writeBuffer(uniformBuffer, 0, uniformValues);
    }

    function ensureAttachments(width, height) {
      if (textureWidth === width && textureHeight === height) return;
      textureWidth = width;
      textureHeight = height;
      depthTexture?.destroy();
      multisampleTexture?.destroy();
      depthTexture = device.createTexture({
        size: [width, height], sampleCount: 4, format: 'depth24plus',
        usage: GPUTextureUsage.RENDER_ATTACHMENT
      });
      multisampleTexture = device.createTexture({
        size: [width, height], sampleCount: 4,
        format: navigator.gpu.getPreferredCanvasFormat(),
        usage: GPUTextureUsage.RENDER_ATTACHMENT
      });
      depthView = depthTexture.createView();
      multisampleView = multisampleTexture.createView();
    }

    window.codexBenchRawWebGPU = {
      setTheme(value) {
        if (value) Object.assign(theme, value);
        updateThemeBackground();
      },
      clearMesh() {
        destroyGeometry();
        lastPositions = undefined;
        notice.textContent = 'Select one of your own STEP files';
        notice.style.display = 'grid';
      },
      loadMesh(payload) {
        const started = performance.now();
        this.clearMesh();
        const decoded = decodeBinary(payload);
        positionBuffer = gpuBuffer(decoded.positions, GPUBufferUsage.VERTEX);
        normalBuffer = gpuBuffer(decoded.normals, GPUBufferUsage.VERTEX);
        colorBuffer = gpuBuffer(decoded.colors, GPUBufferUsage.VERTEX);
        indexBuffer = gpuBuffer(decoded.indices, GPUBufferUsage.INDEX);
        if (decoded.edges.length) edgeBuffer = gpuBuffer(decoded.edges, GPUBufferUsage.VERTEX);
        indexCount = decoded.indices.length;
        edgeVertexCount = decoded.edges.length / 3;
        lastPositions = decoded.positions;
        fitPositions(decoded.positions);
        notice.style.display = 'none';
        const result = {
          type: 'loaded', triangles: payload.triangles,
          milliseconds: performance.now() - started
        };
        send(result);
        return result;
      },
      fit() { if (lastPositions) fitPositions(lastPositions); },
      orbit(deltaX, deltaY) {
        yaw -= deltaX * 0.006;
        pitch = Math.max(-1.52, Math.min(1.52, pitch + deltaY * 0.006));
      }
    };

    let dragMode;
    let lastPoint;
    let mouseMoved = false;
    canvas.addEventListener('contextmenu', event => event.preventDefault());
    canvas.addEventListener('mousedown', event => {
      canvas.focus();
      lastPoint = [event.clientX, event.clientY];
      mouseMoved = false;
      dragMode = event.button === 2 ? (event.shiftKey ? 'roll' : 'orbit')
        : (event.button === 1 || event.shiftKey ? 'pan' : undefined);
    });
    addEventListener('mousemove', event => {
      if (!lastPoint) return;
      const dx = event.clientX - lastPoint[0];
      const dy = event.clientY - lastPoint[1];
      if (Math.hypot(dx, dy) > 2) mouseMoved = true;
      if (!dragMode) return;
      lastPoint = [event.clientX, event.clientY];
      if (dragMode === 'orbit') {
        yaw -= dx * 0.006;
        pitch = Math.max(-1.52, Math.min(1.52, pitch + dy * 0.006));
      } else if (dragMode === 'roll') {
        roll += dx * 0.006;
      } else {
        const currentCamera = camera();
        const amount = distance * 0.0015;
        target = add(target, add(
          scale(currentCamera.right, -dx * amount), scale(currentCamera.up, dy * amount)));
      }
    });
    addEventListener('mouseup', event => {
      if (event.button === 0 && !mouseMoved && indexCount) selected = !selected;
      dragMode = undefined;
      lastPoint = undefined;
    });
    canvas.addEventListener('wheel', event => {
      event.preventDefault();
      distance = Math.max(0.002, distance * Math.exp(event.deltaY * 0.0015));
    }, { passive: false });

    let frames = 0;
    let lastReport = performance.now();
    function draw(now) {
      const ratio = Math.min(devicePixelRatio || 1, 2);
      const width = Math.max(1, Math.floor(canvas.clientWidth * ratio));
      const height = Math.max(1, Math.floor(canvas.clientHeight * ratio));
      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
      }
      ensureAttachments(width, height);
      writeUniforms(width, height);
      const encoder = device.createCommandEncoder();
      const pass = encoder.beginRenderPass({
        colorAttachments: [{
          view: multisampleView,
          resolveTarget: context.getCurrentTexture().createView(),
          clearValue: {
            r: theme.background[0], g: theme.background[1], b: theme.background[2], a: 1
          },
          loadOp: 'clear', storeOp: 'discard'
        }],
        depthStencilAttachment: {
          view: depthView, depthClearValue: 1,
          depthLoadOp: 'clear', depthStoreOp: 'store'
        }
      });
      pass.setBindGroup(0, bindGroup);
      if (indexCount) {
        pass.setPipeline(surfacePipeline);
        pass.setVertexBuffer(0, positionBuffer);
        pass.setVertexBuffer(1, normalBuffer);
        pass.setVertexBuffer(2, colorBuffer);
        pass.setIndexBuffer(indexBuffer, 'uint32');
        pass.drawIndexed(indexCount);
      }
      if (edgeVertexCount && (theme.edgeStrength || 0) > 0.02) {
        pass.setPipeline(edgePipeline);
        pass.setVertexBuffer(0, edgeBuffer);
        pass.draw(edgeVertexCount);
      }
      pass.end();
      device.queue.submit([encoder.finish()]);
      frames += 1;
      if (now - lastReport >= 1000) {
        send({ type: 'frames', count: frames });
        frames = 0;
        lastReport = now;
      }
      requestAnimationFrame(draw);
    }

    async function start() {
      if (!navigator.gpu) throw new Error('Raw WebGPU is unavailable in this WKWebView.');
      const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
      if (!adapter) throw new Error('WebKit could not provide a WebGPU adapter.');
      device = await adapter.requestDevice();
      context = canvas.getContext('webgpu');
      if (!context) throw new Error('The canvas could not create a WebGPU context.');
      const format = navigator.gpu.getPreferredCanvasFormat();
      context.configure({ device, format, alphaMode: 'opaque' });
      const module = device.createShaderModule({ code: shaderSource });
      uniformBuffer = device.createBuffer({ size: 256, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
      const bindGroupLayout = device.createBindGroupLayout({ entries: [{
        binding: 0, visibility: GPUShaderStage.VERTEX | GPUShaderStage.FRAGMENT,
        buffer: { type: 'uniform', minBindingSize: 224 }
      }] });
      const layout = device.createPipelineLayout({ bindGroupLayouts: [bindGroupLayout] });
      bindGroup = device.createBindGroup({
        layout: bindGroupLayout, entries: [{ binding: 0, resource: { buffer: uniformBuffer } }]
      });
      const depthStencil = {
        format: 'depth24plus', depthWriteEnabled: true, depthCompare: 'less'
      };
      surfacePipeline = device.createRenderPipeline({
        layout,
        vertex: {
          module, entryPoint: 'surfaceVertex', buffers: [
            { arrayStride: 12, attributes: [{ shaderLocation: 0, offset: 0, format: 'float32x3' }] },
            { arrayStride: 12, attributes: [{ shaderLocation: 1, offset: 0, format: 'float32x3' }] },
            { arrayStride: 4, attributes: [{ shaderLocation: 2, offset: 0, format: 'unorm8x4' }] }
          ]
        },
        fragment: { module, entryPoint: 'surfaceFragment', targets: [{ format }] },
        primitive: { topology: 'triangle-list', cullMode: 'back' },
        depthStencil,
        multisample: { count: 4 }
      });
      edgePipeline = device.createRenderPipeline({
        layout,
        vertex: {
          module, entryPoint: 'edgeVertex', buffers: [
            { arrayStride: 12, attributes: [{ shaderLocation: 0, offset: 0, format: 'float32x3' }] }
          ]
        },
        fragment: { module, entryPoint: 'edgeFragment', targets: [{ format }] },
        primitive: { topology: 'line-list' },
        depthStencil: { format: 'depth24plus', depthWriteEnabled: false, depthCompare: 'less-equal' },
        multisample: { count: 4 }
      });
      device.lost.then(info => send({
        type: 'error', message: `Raw WebGPU device lost: ${info.message || info.reason}`
      }));
      device.addEventListener('uncapturederror', event => send({
        type: 'error', message: `Raw WebGPU error: ${event.error?.message || event.error}`
      }));
      updateThemeBackground();
      notice.textContent = 'Select one of your own STEP files';
      send({ type: 'ready', backend: 'WebGPU' });
      requestAnimationFrame(draw);
    }

    start().catch(error => {
      notice.textContent = `Raw WebGPU failed: ${error?.message || error}`;
      send({ type: 'error', message: notice.textContent });
    });
  </script>
</body>
</html>
