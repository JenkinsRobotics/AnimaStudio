    <path d="M178 300H846M178 512H846M178 724H846"/>
    <path d="M300 178V846M512 178V846M724 178V846"/>
  </g>

  <!-- Construction geometry: the A is a constrained sketch, not a rig. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M294 752L504 268L730 752" stroke="#eafaff" stroke-opacity="0.24" stroke-width="58"/>
