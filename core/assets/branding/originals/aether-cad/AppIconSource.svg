  <rect x="72" y="72" width="880" height="880" rx="218" fill="url(#background)" filter="url(#shadow)"/>
  <rect x="91" y="91" width="842" height="842" rx="199" fill="none" stroke="#ffffff" stroke-opacity="0.11" stroke-width="8"/>

