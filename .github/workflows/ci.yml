name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  web-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Aether UI — tests + typecheck + build
        working-directory: core/ui
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build

      - name: Aether Animation web — build
        working-directory: aether-animation/web
        run: |
          npm ci
          npm run build

      - name: Aether Studio admin — build
        working-directory: studio
        run: |
          npm ci
          npm run build

  python-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: python -m pytest animacore/tests core/host/tests -q
